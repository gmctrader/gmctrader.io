  <text x="64" y="714" fill="#758078" font-family="Arial,sans-serif" font-size="10">A few sample rows from an illustrative journal. No real account or trade history is included.</text><rect x="1080" y="691" width="296" height="37" rx="10" fill="#111612" stroke="#2f3932"/><text x="1100" y="714" fill="#a6c99e" font-family="Arial,sans-serif" font-size="10" font-weight="600">Chart reference · link only ↗</text><text x="64" y="771" fill="#758078" font-family="monospace" font-size="9" letter-spacing="1">ILLUSTRATIVE JOURNAL VIEW · NOT LIVE</text>
