<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SciFe — Ghost Discipline</title>
<link rel="icon" type="image/png" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,650&family=Instrument+Sans:ital,wght@0,400;0,600;0,700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#ffffff;
    --bronze-bright:#059669;
    --bronze:#10b981;
    --platinum:#10201b;
    --slate:#5b6663;
    --slate-dim:#8a9491;
    --steel:rgba(15,23,22,0.09);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;width:100%;}
  body{
    background:
      radial-gradient(ellipse 1000px 620px at 18% -10%, rgba(16,185,129,0.07), transparent 60%),
      radial-gradient(ellipse 900px 700px at 100% 105%, rgba(45,212,191,0.05), transparent 55%),
      #ffffff;
    color:var(--platinum);
    font-family:'Instrument Sans',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:440px;
    width:100%;
    text-align:center;
    background:rgba(255,255,255,0.86);
    border:1px solid var(--steel);
    border-radius:22px;
    padding:44px 32px;
    box-shadow:0 14px 30px rgba(0,0,0,0.08);
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--bronze-bright);
    background:rgba(16,185,129,0.1);
    border:1px solid rgba(16,185,129,0.25);
    padding:6px 12px;
    border-radius:999px;
    margin-bottom:20px;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--bronze);animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  h1{
    font-family:'Fraunces',serif;
    font-weight:650;
    font-size:28px;
    margin:0 0 12px;
  }
  p{
    color:var(--slate);
    font-size:15px;
    line-height:1.6;
    margin:0 0 28px;
  }
  .btn{
    display:inline-block;
    background:var(--bronze);
    color:#ffffff;
    font-weight:600;
    font-size:14px;
    padding:12px 24px;
    border-radius:12px;
    text-decoration:none;
    border:none;
    cursor:pointer;
  }
  .btn:hover{background:var(--bronze-bright);}
</style>
</head>
<body>
  <div class="card">
    <div class="badge"><span class="dot"></span>In development</div>
    <h1>SciFe is coming</h1>
    <p>Your voice AI trading companion is being built. It'll plug into your journal using your own API key, synced securely to your account. Check back soon.</p>
    <a class="btn" href="index.html">Back to Ghost Discipline</a>
  </div>
</body>
</html>
