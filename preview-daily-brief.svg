<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title description">
  <title id="title">Daily Brief and pair watch sample</title>
  <desc id="description">A cropped, browser-free Ghost Discipline workspace preview showing a four-symbol demo watchlist and a pre-session checklist. No live quotes or personal account data are shown.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141b15"/><stop offset="1" stop-color="#080b09"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#151a16"/><stop offset="1" stop-color="#101311"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#a6c99e"/><stop offset="1" stop-color="#d4c28c"/></linearGradient>
  </defs>
  <rect width="1440" height="810" rx="24" fill="#070908"/><rect x="1" y="1" width="1438" height="808" rx="23" fill="url(#bg)" stroke="#2a302c"/>
  <rect width="1440" height="76" rx="23" fill="#0b0e0c"/><path d="M0 76h1440" stroke="#262c28"/>
