  <text x="64" y="125" fill="#a7c39a" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1.8">PLAN BEFORE THE SESSION</text><text x="64" y="172" fill="#f0f1ec" font-family="Georgia,serif" font-size="34" font-weight="700">Daily Brief</text><text x="64" y="199" fill="#939b93" font-family="Arial,sans-serif" font-size="14">A focused look at your plan, risk, and chosen markets.</text>
