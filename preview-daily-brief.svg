  <text x="302" y="45" fill="#e9ece5" font-family="Arial,sans-serif" font-size="12" font-weight="600">Overview</text><rect x="412" y="15" width="122" height="46" rx="12" fill="#1a211c" stroke="#3b473d"/><text x="430" y="43" fill="#edf0e9" font-family="Arial,sans-serif" font-size="12" font-weight="600">Daily Brief</text><text x="565" y="43" fill="#9ea79e" font-family="Arial,sans-serif" font-size="12">Journal</text><text x="659" y="43" fill="#9ea79e" font-family="Arial,sans-serif" font-size="12">Analytics</text><text x="764" y="43" fill="#9ea79e" font-family="Arial,sans-serif" font-size="12">Markets</text><text x="860" y="43" fill="#9ea79e" font-family="Arial,sans-serif" font-size="12">Trading</text><text x="958" y="43" fill="#9ea79e" font-family="Arial,sans-serif" font-size="12">Prop</text><text x="1032" y="43" fill="#9ea79e" font-family="Arial,sans-serif" font-size="12">More</text>
