  <rect x="923" y="552" width="481" height="186" rx="19" fill="#111612" stroke="#303833"/><text x="953" y="591" fill="#e7eae3" font-family="Georgia,serif" font-size="19" font-weight="700">A calmer start</text><text x="953" y="620" fill="#a5ada3" font-family="Arial,sans-serif" font-size="12">Review the setup. Respect your limits.</text><text x="953" y="642" fill="#a5ada3" font-family="Arial,sans-serif" font-size="12">Let the plan—not the candle—set the pace.</text><rect x="953" y="667" width="168" height="37" rx="10" fill="#1b271d" stroke="#3d553e"/><text x="1037" y="691" text-anchor="middle" fill="#d9e4d2" font-family="Arial,sans-serif" font-size="11" font-weight="600">Open workspace →</text>
