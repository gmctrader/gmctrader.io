  <g font-family="Arial,sans-serif"><circle cx="116" cy="499" r="11" fill="#202a20"/><text x="116" y="502" text-anchor="middle" fill="#aec29d" font-family="monospace" font-size="8">01</text><text x="140" y="503" fill="#d4dbd1" font-size="11">Pause before you act</text><circle cx="116" cy="540" r="11" fill="#202a20"/><text x="116" y="543" text-anchor="middle" fill="#aec29d" font-family="monospace" font-size="8">02</text><text x="140" y="544" fill="#d4dbd1" font-size="11">Review your plan</text><circle cx="116" cy="581" r="11" fill="#202a20"/><text x="116" y="584" text-anchor="middle" fill="#aec29d" font-family="monospace" font-size="8">03</text><text x="140" y="585" fill="#d4dbd1" font-size="11">Decide with intention</text></g>
  <text x="493" y="231" fill="#a6c99e" font-family="monospace" font-size="10" letter-spacing="1.7">YOUR TRADING COMPANION</text><text x="493" y="292" fill="#f0f2e9" font-family="Georgia,serif" font-size="37" font-weight="700">Make your next decision</text><text x="493" y="338" fill="#f0f2e9" font-family="Georgia,serif" font-size="37" font-weight="700">a deliberate one.</text><text x="493" y="374" fill="#a5aea4" font-family="Arial,sans-serif" font-size="14">Review your journal, reset your mindset, or test a setup against your own rules.</text>
