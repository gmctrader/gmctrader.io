  <rect x="521" y="521" width="420" height="49" rx="12" fill="#171e18" stroke="#344034"/><rect x="535" y="533" width="26" height="26" rx="8" fill="#233125"/><text x="548" y="550" text-anchor="middle" fill="#c0d4ad" font-family="monospace" font-size="8">03</text><text x="576" y="543" fill="#e4e9e1" font-family="Arial,sans-serif" font-size="12" font-weight="600">Check your mindset</text><text x="576" y="560" fill="#a0aa9f" font-family="Arial,sans-serif" font-size="10">Name what is influencing you.</text><text x="915" y="551" text-anchor="end" fill="#a6c99e" font-size="15">↗</text>
  <rect x="956" y="521" width="420" height="49" rx="12" fill="#171e18" stroke="#344034"/><rect x="970" y="533" width="26" height="26" rx="8" fill="#233125"/><text x="983" y="550" text-anchor="middle" fill="#c0d4ad" font-family="monospace" font-size="8">04</text><text x="1011" y="543" fill="#e4e9e1" font-family="Arial,sans-serif" font-size="12" font-weight="600">Review a setup</text><text x="1011" y="560" fill="#a0aa9f" font-family="Arial,sans-serif" font-size="10">Compare an idea with your rules.</text><text x="1350" y="551" text-anchor="end" fill="#a6c99e" font-size="15">↗</text>
  <rect x="493" y="605" width="911" height="126" rx="18" fill="#0f1410" stroke="#2c352e"/><path d="M493 650h911" stroke="#252d27"/><circle cx="518" cy="628" r="4" fill="#a6c99e"/><text x="532" y="632" fill="#bdc9b8" font-family="monospace" font-size="9" letter-spacing="1">SAMPLE CONVERSATION</text><text x="1375" y="632" text-anchor="end" fill="#798479" font-family="Arial,sans-serif" font-size="9">Reflective support · not a signal</text><rect x="519" y="666" width="825" height="44" rx="12" fill="#151b16" stroke="#29332c"/><text x="539" y="684" fill="#d3d9d0" font-family="Arial,sans-serif" font-size="11">“Before we review the setup, what would make this trade invalid?”</text><text x="539" y="700" fill="#889389" font-family="Arial,sans-serif" font-size="9">SciFe helps you think through your process—not predict a market.</text>
