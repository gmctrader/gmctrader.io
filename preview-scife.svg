<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title description">
  <title id="title">SciFe trading companion sample</title>
  <desc id="description">A browser-free SciFe companion preview showing the real product's reflective prompts and fictional sample conversation. It does not give a trading signal.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101811"/><stop offset=".55" stop-color="#09100b"/><stop offset="1" stop-color="#080b09"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#151c16"/><stop offset="1" stop-color="#101511"/></linearGradient><radialGradient id="orb"><stop stop-color="#dbe7cb"/><stop offset=".42" stop-color="#9db98c"/><stop offset="1" stop-color="#2c4731"/></radialGradient></defs>
  <rect width="1440" height="810" rx="24" fill="#070908"/><rect x="1" y="1" width="1438" height="808" rx="23" fill="url(#bg)" stroke="#2a342d"/>
  <rect x="34" y="19" width="39" height="39" rx="13" fill="#17201a" stroke="#34443a"/><circle cx="53.5" cy="38.5" r="10" fill="none" stroke="#b4c9a4" stroke-width="1.5"/><path d="M48 40c2-4 8-4 11 0m-9 4h7" fill="none" stroke="#d9e2cf" stroke-width="1.4" stroke-linecap="round"/><text x="84" y="37" fill="#e6e9e2" font-family="Arial,sans-serif" font-size="15" font-weight="700">Ghost Discipline</text><text x="84" y="54" fill="#778178" font-family="monospace" font-size="8" letter-spacing="1.3">TRADING COMPANION</text><path d="M0 76h1440" stroke="#29332c"/>
