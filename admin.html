<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Discipline — Admin</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,650;1,9..144,500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --void:#03050a; --void-2:#0a1119; --graphite:#0e1720; --graphite-hi:#152029;
  --panel:rgba(14,22,28,0.82); --panel-solid:#0b131a;
  --border:rgba(240,244,242,0.10); --border-hi:rgba(240,244,242,0.18);
  --teal:#2dd4a8; --teal-dim:#0b5c42; --teal-ink:#03110c;
  --amber:#f0a94e;
  --gold:#f2c877; --gold-dim:#8a6b28;
  --text:#eef6f2; --text-dim:#8fa6a0; --text-faint:#5e7772;
  --danger:#ff5d7a;
  --r-sm:8px; --r-md:13px; --r-lg:18px;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:'Instrument Sans', system-ui, sans-serif;
  background:
    radial-gradient(ellipse 1000px 620px at 18% -10%, rgba(45,212,168,0.08), transparent 60%),
    radial-gradient(ellipse 900px 700px at 100% 105%, rgba(242,200,119,0.05), transparent 55%),
    var(--void);
}
.serif{ font-family:'Fraunces', serif; }
.mono{ font-family:'IBM Plex Mono', monospace; }
a{ color:inherit; }

/* ---------- shell ---------- */
.wrap{ max-width:1040px; margin:0 auto; padding:32px 20px 80px; }
.topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; gap:12px; flex-wrap:wrap; }
.brand{ display:flex; align-items:center; gap:12px; }
.brand-badge{
  width:38px; height:38px; border-radius:10px; background:var(--graphite-hi);
  border:1px solid var(--border-hi); display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono'; font-weight:700; font-size:13px; color:var(--teal);
}
.brand h1{ font-size:19px; margin:0; font-weight:650; }
.brand .sub{ font-size:12px; color:var(--text-dim); margin-top:1px; }

.btn{
  font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
  border-radius:10px; padding:10px 16px; border:1px solid var(--border-hi);
  background:var(--graphite); color:var(--text); transition:all .15s ease;
}
.btn:hover{ background:var(--graphite-hi); }
.btn:disabled{ opacity:.5; cursor:default; }
.btn-teal{ background:var(--teal); color:var(--teal-ink); border-color:var(--teal); }
.btn-teal:hover{ filter:brightness(1.08); }
.btn-ghost{ background:transparent; }
.btn-sm{ padding:7px 12px; font-size:12.5px; border-radius:8px; }

/* ---------- panels ---------- */
.card{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:22px; margin-bottom:20px; backdrop-filter:blur(10px);
}
.card h2{ font-size:15px; margin:0 0 4px; font-weight:650; }
.card .hint{ font-size:12.5px; color:var(--text-dim); margin:0 0 16px; line-height:1.5; }

/* ---------- auth gate ---------- */
#gate{ max-width:400px; margin:80px auto 0; }
#gate .field{ margin-bottom:14px; }
#gate label{ display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px; }
#gate input{
  width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--border-hi);
  background:var(--void-2); color:var(--text); font-family:inherit; font-size:14px;
}
#gate input:focus{ outline:none; border-color:var(--teal); }
.msg{ font-size:13px; padding:10px 12px; border-radius:8px; margin:12px 0; display:none; }
.msg.show{ display:block; }
.msg.error{ background:rgba(255,93,122,0.12); color:var(--danger); border:1px solid rgba(255,93,122,0.3); }
.msg.ok{ background:rgba(45,212,168,0.1); color:var(--teal); border:1px solid rgba(45,212,168,0.3); }

/* ---------- stats strip ---------- */
.stats{ display:flex; gap:12px; flex-wrap:wrap; }
.stat{
  flex:1; min-width:110px; background:var(--void-2); border:1px solid var(--border);
  border-radius:var(--r-md); padding:14px 16px;
}
.stat .n{ font-family:'IBM Plex Mono'; font-size:24px; font-weight:700; }
.stat .l{ font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }
.stat.free .n{ color:var(--text); }
.stat.pro .n{ color:var(--amber); }
.stat.elite .n{ color:var(--gold); }

/* ---------- search ---------- */
.searchRow{ display:flex; gap:10px; margin-bottom:4px; }
.searchRow input{
  flex:1; padding:11px 13px; border-radius:9px; border:1px solid var(--border-hi);
  background:var(--void-2); color:var(--text); font-family:inherit; font-size:14px;
}
.searchRow input:focus{ outline:none; border-color:var(--teal); }

/* ---------- results table ---------- */
table{ width:100%; border-collapse:collapse; margin-top:16px; }
th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); padding:0 10px 10px; font-weight:600; }
td{ padding:12px 10px; border-top:1px solid var(--border); font-size:13.5px; vertical-align:middle; }
tr:hover td{ background:rgba(255,255,255,0.015); }
.email{ font-weight:600; }
.meta{ color:var(--text-dim); font-size:12px; margin-top:2px; }
.badge{ font-family:'IBM Plex Mono'; font-size:11px; padding:3px 8px; border-radius:6px; border:1px solid var(--border-hi); display:inline-block; }
.badge.yes{ color:var(--teal); border-color:rgba(45,212,168,0.35); background:rgba(45,212,168,0.08); }
.badge.no{ color:var(--text-faint); }
select.tierSel{
  font-family:'IBM Plex Mono'; font-size:13px; font-weight:600; padding:7px 10px;
  border-radius:8px; border:1px solid var(--border-hi); background:var(--void-2); color:var(--text); cursor:pointer;
}
select.tierSel[data-tier="pro"]{ color:var(--amber); }
select.tierSel[data-tier="elite"]{ color:var(--gold); }
.rowSaveBtn{ margin-left:8px; }
.saveState{ font-size:11.5px; margin-left:8px; color:var(--text-dim); }
.saveState.ok{ color:var(--teal); }
.saveState.err{ color:var(--danger); }
.empty{ text-align:center; color:var(--text-dim); padding:40px 0; font-size:13.5px; }
.profileCell{ max-width:220px; }
.profileCell .row{ font-size:12px; color:var(--text-dim); }
.profileCell .row b{ color:var(--text); font-weight:600; }

.spinner{
  width:14px; height:14px; border-radius:50%; border:2px solid var(--border-hi);
  border-top-color:var(--teal); animation:spin .7s linear infinite; display:inline-block; vertical-align:middle;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

.userTag{ font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--text-faint); }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h2 class="serif" style="font-size:20px;">Ghost Discipline — Admin</h2>
    <p class="hint">Sign in with an admin account to manage trader tiers.</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" autocomplete="email" placeholder="you@domain.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div class="msg" id="loginMsg"></div>
    <button class="btn btn-teal" id="loginBtn" style="width:100%;" onclick="doLogin()">Sign In</button>
  </div>
</div>

<div class="wrap" id="panel" style="display:none;">
  <div class="topbar">
    <div class="brand">
      <div class="brand-badge">GD</div>
      <div>
        <h1>Admin Panel</h1>
        <div class="sub mono" id="whoami"></div>
      </div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()">Sign out</button>
  </div>

  <div class="card">
    <h2>Overview</h2>
    <p class="hint">Live counts across every trader account.</p>
    <div class="stats" id="statsRow">
      <div class="stat free"><div class="n">—</div><div class="l">Free</div></div>
      <div class="stat pro"><div class="n">—</div><div class="l">Pro</div></div>
      <div class="stat elite"><div class="n">—</div><div class="l">Elite</div></div>
    </div>
  </div>

  <div class="card">
    <h2>Traders</h2>
    <p class="hint">Search by email. Change a trader's tier and hit Save — it takes effect immediately, no code deploy needed.</p>
    <div class="searchRow">
      <input type="text" id="searchInput" placeholder="Search by email…" onkeydown="if(event.key==='Enter')runSearch()">
      <button class="btn btn-teal" id="searchBtn" onclick="runSearch()">Search</button>
    </div>
    <div id="resultsWrap"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://euvfoyxntkqxoydgpqjq.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1dmZveXhudGtxeG95ZGdwcWpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNzg3MjQsImV4cCI6MjEwMDc1NDcyNH0.7P9bpz4i4ekENWBsnsI-Bs-pPqL8r2E1S-GkeXI5v-8";
let sb;
try{
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}catch(e){
  document.getElementById('loginMsg').textContent = 'Could not load Supabase — check your connection.';
  document.getElementById('loginMsg').className = 'msg show error';
}

function showMsg(el, text, cls){
  el.textContent = text;
  el.className = 'msg show ' + cls;
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');
  const btn = document.getElementById('loginBtn');
  if(!email || !password){ showMsg(msg, 'Enter your email and password.', 'error'); return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  try{
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ showMsg(msg, error.message || 'Sign in failed.', 'error'); return; }
    await checkAdminAndEnter();
  }catch(e){
    showMsg(msg, 'Something went wrong. Try again.', 'error');
  }finally{
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

async function doLogout(){
  await sb.auth.signOut();
  document.getElementById('panel').style.display = 'none';
  document.getElementById('gate').style.display = 'block';
  document.getElementById('loginPassword').value = '';
}

async function checkAdminAndEnter(){
  const msg = document.getElementById('loginMsg');
  const { data: userData } = await sb.auth.getUser();
  const user = userData?.user;
  if(!user){ showMsg(msg, 'Could not verify your session — try signing in again.', 'error'); return; }
  const { data: isAdmin, error } = await sb.rpc('is_app_admin');
  if(error){
    showMsg(msg, "Couldn't verify admin access. Have you run admin-setup.sql yet?", 'error');
    return;
  }
  if(!isAdmin){
    showMsg(msg, `Signed in as ${user.email}, but this account isn't an admin.`, 'error');
    await sb.auth.signOut();
    return;
  }
  document.getElementById('whoami').textContent = user.email;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  loadStats();
  runSearch();
}

async function loadStats(){
  const { data, error } = await sb.rpc('admin_tier_counts');
  if(error || !data) return;
  const counts = { free:0, pro:0, elite:0 };
  data.forEach(row => { if(counts.hasOwnProperty(row.tier)) counts[row.tier] = row.count; });
  const row = document.getElementById('statsRow');
  row.innerHTML = `
    <div class="stat free"><div class="n">${counts.free}</div><div class="l">Free</div></div>
    <div class="stat pro"><div class="n">${counts.pro}</div><div class="l">Pro</div></div>
    <div class="stat elite"><div class="n">${counts.elite}</div><div class="l">Elite</div></div>
  `;
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function runSearch(){
  const q = document.getElementById('searchInput').value.trim();
  const wrap = document.getElementById('resultsWrap');
  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  wrap.innerHTML = '<div class="empty"><span class="spinner"></span>&nbsp; Searching…</div>';
  try{
    const { data, error } = await sb.rpc('admin_search_traders', { p_query: q });
    if(error){
      wrap.innerHTML = `<div class="empty" style="color:var(--danger)">Search failed: ${escapeHtml(error.message)}</div>`;
      return;
    }
    if(!data || !data.length){
      wrap.innerHTML = '<div class="empty">No traders found.</div>';
      return;
    }
    renderResults(data);
  }catch(e){
    wrap.innerHTML = '<div class="empty" style="color:var(--danger)">Something went wrong.</div>';
  }finally{
    btn.disabled = false;
  }
}

function renderResults(rows){
  const wrap = document.getElementById('resultsWrap');
  const table = document.createElement('table');
  table.innerHTML = `
    <thead><tr>
      <th>Trader</th>
      <th>Profile</th>
      <th>Onboarded</th>
      <th>Tier</th>
      <th></th>
    </tr></thead>
    <tbody></tbody>
  `;
  const tbody = table.querySelector('tbody');
  rows.forEach(r => {
    const tr = document.createElement('tr');
    const p = r.profile || {};
    const joined = r.created_at ? new Date(r.created_at).toLocaleDateString() : '—';
    tr.innerHTML = `
      <td>
        <div class="email">${escapeHtml(r.email)}</div>
        <div class="meta userTag">${escapeHtml(r.user_id)}</div>
        <div class="meta">Joined ${joined}</div>
      </td>
      <td class="profileCell">
        ${p.goal ? `<div class="row"><b>Goal:</b> ${escapeHtml(p.goal)}</div>` : ''}
        ${p.markets ? `<div class="row"><b>Markets:</b> ${escapeHtml(p.markets)}</div>` : ''}
        ${p.weakness ? `<div class="row"><b>Weakness:</b> ${escapeHtml(p.weakness)}</div>` : ''}
        ${(!p.goal && !p.markets && !p.weakness) ? '<div class="meta">No profile data yet.</div>' : ''}
      </td>
      <td><span class="badge ${r.onboarding_done ? 'yes' : 'no'}">${r.onboarding_done ? 'Done' : 'Pending'}</span></td>
      <td>
        <select class="tierSel" data-tier="${r.tier}" data-user="${r.user_id}" onchange="onTierSelectChange(this)">
          <option value="free" ${r.tier==='free'?'selected':''}>Free</option>
          <option value="pro" ${r.tier==='pro'?'selected':''}>Pro</option>
          <option value="elite" ${r.tier==='elite'?'selected':''}>Elite</option>
        </select>
      </td>
      <td>
        <button class="btn btn-teal btn-sm rowSaveBtn" style="display:none;" onclick="saveTier(this)">Save</button>
        <span class="saveState"></span>
      </td>
    `;
    tbody.appendChild(tr);
  });
  wrap.innerHTML = '';
  wrap.appendChild(table);
}

function onTierSelectChange(sel){
  sel.dataset.tier = sel.value;
  const tr = sel.closest('tr');
  tr.querySelector('.rowSaveBtn').style.display = 'inline-block';
  tr.querySelector('.saveState').textContent = '';
  tr.querySelector('.saveState').className = 'saveState';
}

async function saveTier(btn){
  const tr = btn.closest('tr');
  const sel = tr.querySelector('.tierSel');
  const stateEl = tr.querySelector('.saveState');
  const userId = sel.dataset.user;
  const tier = sel.value;
  const label = tier.charAt(0).toUpperCase() + tier.slice(1);
  if(tier === 'free' && !confirm(`Downgrade this trader to Free? This removes their Pro/Elite access immediately.`)) return;
  btn.disabled = true;
  stateEl.textContent = 'Saving…';
  stateEl.className = 'saveState';
  try{
    const { data, error } = await sb.rpc('admin_set_tier', { p_user_id: userId, p_tier: tier });
    if(error || !data){
      stateEl.textContent = error ? error.message : 'No matching trader row.';
      stateEl.className = 'saveState err';
      return;
    }
    stateEl.textContent = `Saved — now ${label}`;
    stateEl.className = 'saveState ok';
    btn.style.display = 'none';
  }catch(e){
    stateEl.textContent = 'Something went wrong.';
    stateEl.className = 'saveState err';
  }finally{
    btn.disabled = false;
  }
}

// Resume an existing session on reload instead of forcing a fresh login.
(async function boot(){
  const { data } = await sb.auth.getSession();
  if(data?.session){ await checkAdminAndEnter(); }
})();
</script>
</body>
</html>
